services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-changeMe123!}@postgres:5432/${DB_NAME:-snake_game}
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 3000
      WS_PATH: /ws
      RESOURCE_PROFILE: ${RESOURCE_PROFILE:-auto}
      NODE_HEAP_MB: ${NODE_HEAP_MB:-256}
      TICK_HZ: ${TICK_HZ:-}
      ROOM_CAPACITY: ${ROOM_CAPACITY:-}
      MAX_ROOMS: ${MAX_ROOMS:-}
      BOT_ENABLE: ${BOT_ENABLE:-true}
      BOT_MIN_PER_ROOM: ${BOT_MIN_PER_ROOM:-}
      ARENA_WIDTH: ${ARENA_WIDTH:-}
      ARENA_HEIGHT: ${ARENA_HEIGHT:-}
      BOOST_CONSUMPTION: ${BOOST_CONSUMPTION:-1}
      BOOST_MIN_LENGTH: ${BOOST_MIN_LENGTH:-4}
      REVIVAL_PROTECTION_DURATION: ${REVIVAL_PROTECTION_DURATION:-3}
      REVIVAL_RESTORE_PERCENT: ${REVIVAL_RESTORE_PERCENT:-50}
      REVIVAL_MAX_PER_RUN: ${REVIVAL_MAX_PER_RUN:-1}
      REVIVAL_CLAIM_EXPIRY: ${REVIVAL_CLAIM_EXPIRY:-300}
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-admin@example.com}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-ChangeMe123!}
      ADMIN_RATE_LIMIT_ATTEMPTS: ${ADMIN_RATE_LIMIT_ATTEMPTS:-5}
      ADMIN_RATE_LIMIT_WINDOW: ${ADMIN_RATE_LIMIT_WINDOW:-300}
      AD_ENABLE: ${AD_ENABLE:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      METRICS_SAMPLE_INTERVAL: ${METRICS_SAMPLE_INTERVAL:-15}
      EVENT_RETENTION_DAYS: ${EVENT_RETENTION_DAYS:-30}
      SITE_URL: ${SITE_URL:-}
      SSL_ENABLED: ${SSL_ENABLED:-false}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    mem_limit: ${APP_MEM_LIMIT:-448m}
    cpus: ${APP_CPUS:-0.5}
    networks:
      - snake-network

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeMe123!}
      POSTGRES_DB: ${DB_NAME:-snake_game}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: ${DB_MEM_LIMIT:-256m}
    cpus: ${DB_CPUS:-0.25}
    networks:
      - snake-network

volumes:
  postgres_data:
    driver: local

networks:
  snake-network:
    driver: bridge
